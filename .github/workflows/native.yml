name: Verify native applications
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mangumi/native typecheck && pnpm test:native
      - run: pnpm --filter @mangumi/native build
      - run: pnpm --filter @mangumi/native exec expo prebuild --platform android --no-install
      - name: Compile Android debug application
        working-directory: apps/native/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: mangumi-android-debug
          path: apps/native/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-diagnostics
          path: apps/native/android/build/reports
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mangumi/native exec expo prebuild --platform ios --no-install
      - run: pod install --project-directory=apps/native/ios
      - name: Compile unsigned iOS Simulator application
        shell: bash
        run: |
          MANGUMI_WORKSPACE=$(find apps/native/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          MANGUMI_SCHEME=$(node -e "const fs=require('fs');process.stdout.write(fs.readdirSync('apps/native/ios').find(p=>p.endsWith('.xcodeproj')).replace('.xcodeproj',''))")
          xcodebuild -workspace "$MANGUMI_WORKSPACE" -scheme "$MANGUMI_SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath "$RUNNER_TEMP/mangumi-ios"
          MANGUMI_APP=$(find "$RUNNER_TEMP/mangumi-ios/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          ditto -c -k --sequesterRsrc --keepParent "$MANGUMI_APP" "$RUNNER_TEMP/mangumi-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mangumi-ios-simulator
          path: ${{ runner.temp }}/mangumi-simulator.zip
          retention-days: 7
